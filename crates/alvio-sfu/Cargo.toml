[package]
name = "alvio-sfu"
description = "Selective Forwarding Unit (SFU) hot-path RTP packet routing, NACK buffering, PLI/FIR keyframe control, and simulcast for AlvioRelay"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
alvio-core = { workspace = true }
alvio-webrtc = { workspace = true }

bytes = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = "0.5"
tokio = { workspace = true, features = ["full"] }

[[bench]]
name = "sfu_routing_bench"
harness = false
