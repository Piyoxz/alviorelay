services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: alviorelay/relay:latest
    container_name: alvio-relay
    restart: unless-stopped
    ports:
      # Control Plane: HTTP API, WebSocket Signaling (/ws), WHIP (/whip/{room_id}), Prometheus (/metrics), Health (/health)
      - "7880:7880/tcp"
      # Media Hot-Path Plane: WebRTC UDP Datagrams (RTP / RTCP)
      - "7882:7882/udp"
    volumes:
      - ./recordings:/app/recordings
      - ./alvio-relay.toml:/app/alvio-relay.toml:ro
    environment:
      - ALVIO_NODE_ID=alvio-relay-docker-01
      - ALVIO_BIND_ADDRESS=0.0.0.0
      - ALVIO_HTTP_PORT=7880
      - ALVIO_RTC_UDP_PORT=7882
      - ALVIO_LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7880/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Companion Prometheus server for instant out-of-the-box observability
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: alvio-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      relay:
        condition: service_healthy
