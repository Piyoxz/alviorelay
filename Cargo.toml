[workspace]
members = [
    "crates/alvio-core",
    "crates/alvio-observe",
    "crates/alvio-protocol",
    "crates/alvio-signal",
    "crates/alvio-webrtc",
    "crates/alvio-sfu",
    "crates/alvio-storage",
    "crates/alvio-egress",
    "crates/alvio-ingress",
    "crates/alvio-hooks",
    "services/relay",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AlvioRelay Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Piyoxz/alviorelay"
homepage = "https://github.com/Piyoxz/alviorelay"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive"] }
bytes = "1.7"
parking_lot = "0.12"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
dashmap = "6.1"
uuid = { version = "1.10", features = ["v4"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
str0m = "0.23.1"
