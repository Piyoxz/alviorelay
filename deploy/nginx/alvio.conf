# AlvioRelay Nginx Production Configuration
# Upstream definition for AlvioRelay daemon
upstream alvio_backend {
    server 127.0.0.1:7880;
    keepalive 64;
}

# Map for WebSocket Connection Upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.yourdomain.com;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name relay.yourdomain.com;

    # SSL Certificates (managed via Certbot or custom certs)
    ssl_certificate /etc/letsencrypt/live/relay.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.yourdomain.com/privkey.pem;

    # SSL Hardening Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Disable proxy buffering for real-time WebRTC WHIP / WebSocket low latency
    proxy_buffering off;
    proxy_request_buffering off;

    # WebSocket Signaling Route (/ws)
    location /ws {
        proxy_pass http://alvio_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket idle timeout (keep connection alive during conferences)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # WHIP Ingestion Route (/whip/)
    location /whip/ {
        proxy_pass http://alvio_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;

        client_max_body_size 2M;
    }

    # Prometheus Metrics (restrict access if desired)
    location /metrics {
        proxy_pass http://alvio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # allow 10.0.0.0/8;
        # deny all;
    }

    # Health & Readiness Probes
    location ~ ^/(health|ready) {
        proxy_pass http://alvio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Default fallback / Web Client Demo
    location / {
        proxy_pass http://alvio_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
